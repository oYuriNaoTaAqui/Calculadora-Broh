name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "cmdline-tools;latest"

      - name: Configurar variáveis Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Preparar diretório do Buildozer
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

      - name: Instalar ferramentas no SDK do Buildozer
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          ln -sfn "$ANDROID_SDK_ROOT/platform-tools" "$SDK/platform-tools" || true
          ln -sfn "$ANDROID_SDK_ROOT/build-tools" "$SDK/build-tools" || true
          ln -sfn "$ANDROID_SDK_ROOT/platforms" "$SDK/platforms" || true
          ln -sfn "$ANDROID_SDK_ROOT/cmdline-tools" "$SDK/cmdline-tools" || true

          echo "$SDK/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Verificar AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Verificando Android SDK..."
          echo "SDK: $SDK"

          ls -la "$SDK/build-tools/34.0.0"

          if [ -f "$SDK/build-tools/34.0.0/aidl" ]; then
            echo "AIDL encontrado!"
          else
            echo "ERRO: AIDL não encontrado!"
            exit 1
          fi

      - name: Compilar APK
        run: |
          buildozer android debug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-APK
          path: bin/*.apk
