name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências Linux
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install legacy-cgi setuptools cython==0.29.34

      - name: Verificar configuração
        run: |
          echo "=== buildozer.spec ==="
          grep -nE "requirements|android.api|android.minapi|android.archs|android.accept_sdk_license|p4a.branch" buildozer.spec

      - name: Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Baixar SDK, NDK e p4a
        run: |
          buildozer android p4a -- --help

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-APK
          path: bin/*.apk
          if-no-files-found: error
