name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Compilar APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Equacoes-APK
          path: ${{ steps.buildozer.outputs.filename }}
